<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="storeModal">
    <!-- Store Locator Modal Overlay -->
    <div id="storeModal" class="store-modal-overlay" style="display: none;" onclick="handleStoreOverlayClick(event)">
        <div class="store-modal-dialog glass-card">
            <!-- Modal Header -->
            <div class="store-modal-header">
                <div>
                    <div class="store-modal-eyebrow">📍 REAL-TIME STORE LOCATOR</div>
                    <h2 id="modalLaptopTitle" class="store-modal-title">Nearby Stores</h2>
                    <p id="modalLaptopSubtitle" class="store-modal-subtitle">
                        Find physical stores and test-drive demo units near your pincode in real time.
                    </p>
                </div>
                <button type="button" class="store-modal-close" onclick="closeStoreModal()" title="Close">✕</button>
            </div>

            <!-- Pincode Search Bar -->
            <div class="store-pincode-bar">
                <div class="store-pincode-input-wrap">
                    <span class="pincode-icon">📮</span>
                    <input type="text" id="storePincodeInput" maxlength="6" pattern="[1-9][0-9]{5}"
                           placeholder="Enter 6-digit Pincode (e.g. 411038)"
                           onkeypress="if(event.key === 'Enter') { event.preventDefault(); fetchNearbyStores(); }">
                </div>
                <button type="button" class="btn btn-store-search" onclick="fetchNearbyStores()">Search Stores</button>
                <button type="button" class="btn btn-outline btn-locate-me" onclick="detectCurrentLocation()" title="Use Geolocation">🎯 Auto-Detect</button>
            </div>

            <!-- Location & Brand Detection Banner -->
            <div id="storeLocationBanner" class="store-location-banner" style="display: none;">
                <span class="location-badge" id="storeLocationText">📍 Kothrud, Pune</span>
                <span class="brand-badge" id="storeBrandBadge">🏷️ ASUS Official Stores & Partners</span>
            </div>

            <!-- Loading State -->
            <div id="storeLoading" class="store-loading" style="display: none;">
                <div class="store-spinner"></div>
                <p>Browsing web & locating authorized stores near your pincode...</p>
            </div>

            <!-- Error / Warning Box -->
            <div id="storeErrorMsg" class="store-error-msg" style="display: none;"></div>

            <!-- Store Cards Container -->
            <div id="storeListContainer" class="store-list-container">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Store Modal Script -->
    <script>
        let currentModalLaptopTitle = '';

        function openStoreModal(laptopTitle) {
            currentModalLaptopTitle = laptopTitle || 'Laptop';
            const modal = document.getElementById('storeModal');
            const titleEl = document.getElementById('modalLaptopTitle');
            const pincodeInput = document.getElementById('storePincodeInput');

            if (titleEl) {
                titleEl.textContent = currentModalLaptopTitle;
            }

            // Restore saved pincode or default to Pune example 411038
            const savedPincode = localStorage.getItem('laptopFinder_pincode') || '411038';
            if (pincodeInput) {
                pincodeInput.value = savedPincode;
            }

            if (modal) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // prevent background scrolling
            }

            // Automatically trigger fetch for seamless experience
            fetchNearbyStores();
        }

        function closeStoreModal() {
            const modal = document.getElementById('storeModal');
            if (modal) {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            }
        }

        function handleStoreOverlayClick(e) {
            if (e.target.id === 'storeModal') {
                closeStoreModal();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeStoreModal();
            }
        });

        function fetchNearbyStores() {
            const pincodeInput = document.getElementById('storePincodeInput');
            const pincode = pincodeInput ? pincodeInput.value.trim() : '';
            const loadingEl = document.getElementById('storeLoading');
            const errorEl = document.getElementById('storeErrorMsg');
            const listEl = document.getElementById('storeListContainer');
            const bannerEl = document.getElementById('storeLocationBanner');
            const locTextEl = document.getElementById('storeLocationText');
            const brandBadgeEl = document.getElementById('storeBrandBadge');

            if (!pincode || !/^[1-9][0-9]{5}$/.test(pincode)) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Please enter a valid 6-digit Indian PIN code (e.g. 411038).';
                    errorEl.style.display = 'block';
                }
                return;
            }

            // Save valid pincode for future searches
            localStorage.setItem('laptopFinder_pincode', pincode);

            // Reset UI states
            if (errorEl) errorEl.style.display = 'none';
            if (loadingEl) loadingEl.style.display = 'flex';
            if (listEl) listEl.innerHTML = '';
            if (bannerEl) bannerEl.style.display = 'none';

            const url = '/api/stores/nearby?laptopTitle=' + encodeURIComponent(currentModalLaptopTitle) + '&pincode=' + encodeURIComponent(pincode);

            fetch(url)
                .then(function(res) {
                    if (!res.ok) throw new Error('Network error: ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    if (loadingEl) loadingEl.style.display = 'none';

                    if (data.status === 'INVALID_PINCODE') {
                        if (errorEl) {
                            errorEl.textContent = '⚠️ ' + data.message;
                            errorEl.style.display = 'block';
                        }
                        return;
                    }

                    // Show banner
                    if (bannerEl && locTextEl && brandBadgeEl) {
                        locTextEl.textContent = '📍 ' + (data.locality || '') + (data.district ? ', ' + data.district : '') + ' (' + data.pincode + ')';
                        brandBadgeEl.textContent = '🏷️ ' + (data.brand || 'Brand') + ' Stores & Retail Partners';
                        bannerEl.style.display = 'flex';
                    }

                    renderStoreList(data.stores, data.brand);
                })
                .catch(function(err) {
                    if (loadingEl) loadingEl.style.display = 'none';
                    if (errorEl) {
                        errorEl.textContent = '⚠️ Failed to fetch store information. Please check your network connection.';
                        errorEl.style.display = 'block';
                    }
                    console.error('Store lookup error:', err);
                });
        }

        function renderStoreList(stores, brand) {
            const listEl = document.getElementById('storeListContainer');
            if (!listEl) return;

            if (!stores || stores.length === 0) {
                listEl.innerHTML = '<div class="no-stores-found">🔍 No stores found nearby for this pincode. Try another nearby pincode.</div>';
                return;
            }

            let html = '';
            stores.forEach(function(store) {
                const isExclusive = store.type && store.type.toLowerCase().includes('exclusive');
                const badgeClass = isExclusive ? 'store-tag-exclusive' : 'store-tag-retailer';
                const openBadgeClass = store.openNow ? 'store-status-open' : 'store-status-closed';
                const openStatusText = store.openNow ? '🟢 Open Now' : '⚪ Closed';

                html += `
                <div class="store-card">
                    <div class="store-card-header">
                        <div class="store-name-wrap">
                            <h3 class="store-name">${escapeHtml(store.name)}</h3>
                            <span class="store-tag ${badgeClass}">${escapeHtml(store.type)}</span>
                        </div>
                        <span class="store-status-badge ${openBadgeClass}">${openStatusText}</span>
                    </div>

                    <div class="store-card-body">
                        <p class="store-address">
                            <span class="store-icon">📍</span>
                            <span>${escapeHtml(store.address)}</span>
                        </p>
                        <div class="store-meta-row">
                            <span class="store-meta-item">
                                <span class="store-icon">⚡</span>
                                <strong>${escapeHtml(store.distance || '~1 km')}</strong> away
                            </span>
                            <span class="store-meta-item">
                                <span class="store-icon">⏰</span>
                                ${escapeHtml(store.openingHours || '10:30 AM - 9:00 PM')}
                            </span>
                        </div>

                        ${store.hasDemoUnits ? `
                        <div class="store-demo-highlight">
                            ✨ <strong>Test Drive Available:</strong> Live physical demo units on display to check keyboard feel, display vibrance, and build quality in person.
                        </div>
                        ` : ''}
                    </div>

                    <div class="store-card-footer">
                        <div class="store-contact-row">
                            <a href="tel:${escapeHtml(store.phone)}" class="store-phone-link">
                                📞 <span>${escapeHtml(store.phone)}</span>
                            </a>
                        </div>
                        <div class="store-actions-row">
                            <a href="${escapeHtml(store.googleMapsUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-store-map">
                                🗺️ View Map
                            </a>
                            <a href="${escapeHtml(store.directionsUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-store-directions">
                                🧭 Directions →
                            </a>
                        </div>
                    </div>
                </div>
                `;
            });

            listEl.innerHTML = html;
        }

        function detectCurrentLocation() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }

            const loadingEl = document.getElementById('storeLoading');
            if (loadingEl) loadingEl.style.display = 'flex';

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    // Coordinates retrieved - default to Pune demo 411038 or reverse lookup
                    if (loadingEl) loadingEl.style.display = 'none';
                    const pincodeInput = document.getElementById('storePincodeInput');
                    // In a browser environment, we keep the reliable postal pincode or prompt:
                    if (!pincodeInput.value) {
                        pincodeInput.value = '411038';
                    }
                    fetchNearbyStores();
                },
                function(err) {
                    if (loadingEl) loadingEl.style.display = 'none';
                    alert('Location access denied or timed out. Please enter your pincode manually.');
                },
                { timeout: 7000 }
            );
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</div>
</body>
</html>
